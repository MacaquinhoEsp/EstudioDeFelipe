<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etereo · Contacto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family:
          "Montserrat", "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande",
          "Lucida Sans", Arial, sans-serif;
      }
      h1,
      h2,
      h3,
      .font-serif {
        font-family: "Montserrat", sans-serif;
      }
      body {
        background-color: #fcf9f5;
        color: #2f2a25;
      }
      .reveal {
        opacity: 0;
        transform: translateY(40px) scale(0.97);
        transition: all 1s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .nav-scrolled {
        background: rgba(255, 245, 235, 0.85) !important;
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px -10px rgba(80, 60, 40, 0.15);
      }
      .btn-3d {
        box-shadow: 0 20px 30px -10px rgba(150, 110, 70, 0.4);
        transition: all 0.25s;
      }
      .btn-3d:hover {
        transform: translateY(-5px);
        box-shadow: 0 30px 40px -12px #b48d62;
      }
      .rounded-4xl {
        border-radius: 2rem;
      }
      /* Navbar siempre visible con fondo semitransparente */
      .navbar-base {
        background: rgba(44, 34, 28, 0.75) !important;
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 235, 210, 0.2);
      }
      .nav-scrolled {
        background: rgba(34, 27, 22, 0.9) !important;
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
      }
      /* Enlaces del nav siempre visibles (blancos/beige) */
      .nav-link {
        color: #f0e4d5 !important;
        font-weight: 500;
        transition: color 0.2s;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }
      .nav-link:hover {
        color: #e6c9a8 !important;
      }
      /* Botón reservar adaptado */
      .nav-btn {
        background: rgba(201, 168, 124, 0.9);
        color: white;
        border: 1px solid rgba(255, 245, 230, 0.3);
      }
      .nav-btn:hover {
        background: #b59573;
      }
      /* Página activa */
      .active-page {
        border-bottom: 2px solid #e6c9a8;
        color: #ffffff !important;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <nav
      id="navbar"
      class="fixed w-full z-50 transition-all duration-500 navbar-base py-3 md:py-4"
    >
      <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
        <!-- Logo como imagen con tamaño fijo pequeño -->
        <a href="home.html" class="flex items-center">
          <img
            src="img/sombrero.png"
            alt="EstudioFelipe"
            class="h-10 w-auto object-contain brightness-0 invert opacity-90 hover:opacity-100 transition"
          />
        </a>
        <ul class="hidden md:flex space-x-8">
          <li>
            <a
              href="home.html"
              class="nav-link hover:!text-[#e6c9a8] transition px-1 py-1"
              >Inicio</a
            >
          </li>
          <li>
            <a
              href="servicios.html"
              class="nav-link hover:!text-[#e6c9a8] transition px-1 py-1"
              >Servicios</a
            >
          </li>
          <li>
            <a
              href="galería.html"
              class="nav-link hover:!text-[#e6c9a8] transition px-1 py-1 font-semibold"
              >Recuerdos</a
            >
          </li>
          <li>
            <a
              href="estudio.html"
              class="nav-link hover:!text-[#e6c9a8] transition px-1 py-1"
              >Estudio</a
            >
          </li>
          <li>
            <a
              href="contacto.html"
              class="nav-link hover:!text-[#e6c9a8] transition px-1 py-1"
              >Contacto</a
            >
          </li>
        </ul>
        <a
          href="contacto.html"
          class="hidden md:inline-block nav-btn text-white px-5 py-2 rounded-full text-sm hover:bg-[#b59573] transition shadow-lg"
          ><i class="fas fa-camera mr-2"></i>Reservar</a
        >
        <div class="md:hidden text-2xl cursor-pointer text-[#f0e4d5]">
          <i class="fas fa-bars"></i>
        </div>
      </div>
    </nav>

    <main class="pt-24">
      <section class="py-16 px-6 bg-[#fcf9f5] min-h-screen flex items-center">
        <div
          class="max-w-4xl mx-auto bg-white/80 backdrop-blur-sm rounded-4xl p-10 md:p-16 shadow-2xl reveal border border-white/60"
        >
          <div class="text-center mb-12">
            <h2 class="text-5xl font-serif text-[#3e332b]">¿Hablamos?</h2>
            <p class="text-[#685e54] mt-4">
              Cuéntanos qué necesitas, te responderemos en menos de 24h
            </p>
          </div>

          <!-- FORMULARIO MODIFICADO PARA PHP -->
          <form
            action="guardar_presupuesto.php"
            method="POST"
            class="grid md:grid-cols-2 gap-6"
          >
            <input
              type="text"
              name="nombre"
              placeholder="Nombre"
              required
              class="p-4 rounded-2xl border border-[#e2cfbb] bg-white/90 focus:outline-none focus:ring-2 focus:ring-[#c9a87c]"
            />
            <input
              type="email"
              name="email"
              placeholder="Email"
              required
              class="p-4 rounded-2xl border border-[#e2cfbb] bg-white/90 focus:outline-none focus:ring-2 focus:ring-[#c9a87c]"
            />
            <input
              type="text"
              name="telefono"
              placeholder="Teléfono (opcional)"
              class="p-4 rounded-2xl border border-[#e2cfbb] bg-white/90 focus:outline-none focus:ring-2 focus:ring-[#c9a87c] md:col-span-2"
            />
            <select
              name="tipo_sesion"
              class="p-4 rounded-2xl border border-[#e2cfbb] bg-white/90 focus:outline-none focus:ring-2 focus:ring-[#c9a87c] md:col-span-2"
            >
              <option value="">Tipo de sesión</option>
              <option value="Boda">Boda</option>
              <option value="Comunión">Comunión</option>
              <option value="Infantil">Infantil</option>
              <option value="Evento">Evento</option>
            </select>
            <textarea
              name="mensaje"
              placeholder="Mensaje"
              rows="4"
              class="p-4 rounded-2xl border border-[#e2cfbb] bg-white/90 focus:outline-none focus:ring-2 focus:ring-[#c9a87c] md:col-span-2"
            ></textarea>
            <button
              type="submit"
              class="md:col-span-2 bg-[#c9a87c] hover:bg-[#b48d62] text-white py-4 rounded-2xl text-lg font-semibold transition-all shadow-xl flex items-center justify-center gap-3 btn-3d"
            >
              <i class="fas fa-paper-plane"></i> Enviar mensaje
            </button>
          </form>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="py-10 text-center text-[#6b5b4f] border-t border-[#e1cfbc]">
      <p class="text-sm tracking-widest">
        EL ESTUDIO DE FELIPE · CARTAGENA · REGIÓN DE MURCIA · ©2026
      </p>
      <p class="text-xs mt-2 text-[#8b755e]">
        Una historia familiar desde 2007
      </p>
      <div class="flex justify-center gap-6 mt-4 text-sm">
        <a
          href="aviso-legal.html"
          class="text-[#8b755e] hover:text-[#c9a87c] transition"
          >Aviso Legal</a
        >
        <a
          href="politica-privacidad.html"
          class="text-[#8b755e] hover:text-[#c9a87c] transition"
          >Política de Privacidad</a
        >
        <a
          href="politica-cookies.html"
          class="text-[#8b755e] hover:text-[#c9a87c] transition"
          >Política de Cookies</a
        >
      </div>
    </footer>

    <script>
      (function () {
        const navbar = document.getElementById("navbar");
        window.addEventListener("scroll", function () {
          if (window.scrollY > 80) {
            navbar.classList.add("nav-scrolled");
            navbar.classList.remove("navbar-base");
          } else {
            navbar.classList.remove("nav-scrolled");
            navbar.classList.add("navbar-base");
          }
        });

        const reveals = document.querySelectorAll(".reveal");
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) entry.target.classList.add("active");
            });
          },
          { threshold: 0.2 },
        );
        reveals.forEach((r) => observer.observe(r));
      })();
    </script>
  </body>
</html>
